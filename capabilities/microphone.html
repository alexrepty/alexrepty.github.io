<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebView · Microphone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Microphone</h1>
    <p class="subtitle" data-bridge-status>Tests the <code>microphone</code> capability via <code>getUserMedia</code>.</p>

    <div class="meter"><span id="level"></span></div>
    <ul class="rows"></ul>

    <div class="actions">
      <button id="start">Start microphone</button>
      <button id="stop">Stop</button>
    </div>

    <script src="rc-bridge.js"></script>
    <script>
      let stream = null;
      let audioCtx = null;
      let raf = null;
      const level = document.getElementById("level");
      const row = RC.addRow("Microphone stream", "pending", "Tap “Start microphone”, then make some noise.");

      function meter(analyser) {
        const data = new Uint8Array(analyser.frequencyBinCount);
        function tick() {
          analyser.getByteTimeDomainData(data);
          let peak = 0;
          for (let i = 0; i < data.length; i++) {
            peak = Math.max(peak, Math.abs(data[i] - 128));
          }
          level.style.width = Math.min(100, Math.round((peak / 128) * 100 * 2)) + "%";
          raf = requestAnimationFrame(tick);
        }
        tick();
      }

      async function start() {
        row.set("pending", "Requesting microphone…");
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const track = stream.getAudioTracks()[0];
          row.set("pass", "Granted · " + (track ? track.label || "microphone active" : "microphone active"));
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          const src = audioCtx.createMediaStreamSource(stream);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          src.connect(analyser);
          meter(analyser);
        } catch (e) {
          row.set("fail", (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : e));
        }
      }

      function stop() {
        if (raf) cancelAnimationFrame(raf), (raf = null);
        if (audioCtx) audioCtx.close(), (audioCtx = null);
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        level.style.width = "0%";
        row.set("info", "Stopped");
      }

      document.getElementById("start").addEventListener("click", start);
      document.getElementById("stop").addEventListener("click", stop);
      window.addEventListener("DOMContentLoaded", start);
    </script>
  </body>
</html>
